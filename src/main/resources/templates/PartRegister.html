<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>Insert title here</title>
</head>
<body>

<div th:insert="fragments/commonui :: userheader"></div>
<div th:insert="fragments/commonui :: usermenu"></div>
<div class="container">

    <div class="card">

        <div class="card-header bg-primary text-white text-center">
            <h3>WELCOME TO PART REGISTER PAGE!</h3>
        </div>

        <div class="card-body">
            <!-- Form id="" -->
            <form method="POST" th:action="@{/part/save}">


                <div class="row">
                    <div class="col-3">
                        <label>PART CODE</label>
                    </div>
                    <div class="col-4">
                        <input class="form-control" id="partCode" name="partCode" type="text"/>
                    </div>
                    <div class="col-5">
                        <span id="partCodeError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Part Dimensions</label>
                    </div>
                    <div class="col-4">
                        W:<input class="form-control" name="partWid" type="text"/>
                        L:<input class="form-control" name="partLen" type="text"/>
                        H:<input class="form-control" name="partHt" type="text"/>
                    </div>
                    <div class="col-5">
                        <span id="partDimError"></span>
                    </div>
                </div>

                <div class="row">
                    <div class="col-3">
                        <label>BASE COST</label>
                    </div>
                    <div class="col-4">
                        <input class="form-control" id="partBaseCost" name="partBaseCost" type="text"/>
                    </div>
                    <div class="col-5">
                        <span id="partBaseCostError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Base Currency</label>
                    </div>
                    <div class="col-4">
                        <select class="form-control" id="partBaseCurrency" name="partBaseCurrency">
                            <option value="">-SELECT-</option>
                            <option value="INR">INR</option>
                            <option value="AUD">AUD</option>
                            <option value="USD">USD</option>
                        </select>
                    </div>
                    <div class="col-5">
                        <span id="partBaseCurrencyError"></span>
                    </div>
                </div>

                <div class="row">
                    <div class="col-3">
                        <label>Uom</label>
                    </div>
                    <div class="col-4">
                        <select class="form-control" id="uom" name="uom.id">
                            <option value="">-SELECT-</option>
                            <option th:each="ob:${uoms}" th:text="${ob.value}" th:value="${ob.key}"/>
                        </select>
                    </div>
                    <div class="col-5">
                        <span id="uomError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Order Method(SALE)</label>
                    </div>
                    <div class="col-4">
                        <select class="form-control" id="omSale" name="omSale.id">
                            <option value="">-SELECT-</option>
                            <option th:each="ob:${omSales}" th:text="${ob.value}" th:value="${ob.key}"/>
                        </select>
                    </div>
                    <div class="col-5">
                        <span id="omSaleError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Description</label>
                    </div>
                    <div class="col-4">
                        <textarea class="form-control" id="partDesc" name="partDesc"></textarea>
                    </div>
                    <div class="col-5">
                        <span id="partDescError"></span>
                    </div>
                </div>

                <input class="btn btn-success" type="submit" value="Add Part"/>
            </form>

        </div> <!-- Card Body end -->

        <div class="card-footer alert alert-success" th:if="${message!=null}">
            <span th:text="${message}"></span>
        </div>

    </div>
    <!-- card end -->

</div>
<!-- container end -->
</body>
</html>
