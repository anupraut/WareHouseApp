<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="ISO-8859-1">
    <title>Insert title here</title>
</head>
<body>

<div th:insert="fragments/commonui :: userheader"></div>
<div th:insert="fragments/commonui :: usermenu"></div>
<div class="container">

    <div class="card">
        <div class="card-header bg-primary text-white text-center">
            <h3>PURCHASE ORDER REGISTE PAGE</h3>
        </div>


        <div class="card-body">
            <form method="POST" th:action="@{/po/save}" th:object="${purchaseOrder}">

                <div class="row">
                    <div class="col-2">
                        <label>ORDER CODE</label>
                    </div>
                    <div class="col-5">
                        <input class="form-control" th:field="*{orderCode}" type="text">
                    </div>
                    <div class="col-5">
                        <span id="orderCodeError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-2">
                        <label>SHIPMENT CODE</label>
                    </div>
                    <div class="col-5">
                        <select class="form-control" id="shipment" th:field="*{shipment.id}">
                            <option value="">-SELECT-</option>
                            <option th:each="ob:${shipments}"
                                    th:text="${ob.value}"
                                    th:value="${ob.key}"
                            />
                        </select>
                    </div>
                    <div class="col-5">
                        <span id="shipmentError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-2">
                        <label>VENDOR</label>
                    </div>
                    <div class="col-5">
                        <select class="form-control" id="vendor" th:field="*{vendor.id}">
                            <option value="">-SELECT-</option>
                            <option th:each="ob:${vendors}"
                                    th:text="${ob.value}"
                                    th:value="${ob.key}"
                            />
                        </select>
                    </div>
                    <div class="col-5">
                        <span id="vendorError"></span>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2">
                        <label>Reference Number</label>
                    </div>
                    <div class="col-5">
                        <input class="form-control" th:field="*{refNumber}" type="text">
                    </div>
                    <div class="col-5">
                        <span id="refNumberError"></span>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2">
                        <label>Quality Check</label>
                    </div>
                    <div class="col-5">
                        <input th:field="*{qltyCheck}" type="radio" value="Required"/> Required
                        <input th:field="*{qltyCheck}" type="radio" value="Not Required"/> Not Required
                    </div>
                    <div class="col-5">
                        <span id="qltyCheckError"></span>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2">
                        <label>Default Status</label>
                    </div>
                    <div class="col-5">
                        <input class="form-control" readOnly th:field="*{status}" type="text"/>
                    </div>
                    <div class="col-5">
                        <span id="statusError"></span>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2">
                        <label>DESCRIPTION</label>
                    </div>
                    <div class="col-5">
                        <textarea class="form-control" th:field="*{description}"></textarea>
                    </div>
                    <div class="col-5">
                        <span id="descriptionError"></span>
                    </div>
                </div>
                <input class="btn btn-success" type="submit" value="CREATE ORDER"/>
            </form>
        </div>
        <!--card body end-->

        <div class="card-footer bg-info text-white text-center" th:if="${message != null}">
            <span th:text="${message}"></span>
        </div>

    </div>
    <!--card end-->

</div>
<!--container end-->

</body>
</html>
