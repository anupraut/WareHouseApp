<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>Insert title here</title>
</head>
<body>

<div th:insert="fragments/commonui :: userheader"></div>
<div th:insert="fragments/commonui :: usermenu"></div>
<div class="container">

    <div class="card">

        <div class="card-header bg-primary text-white text-center">
            <h3>WELCOME TO SHIPMENT TYPE DATA PAGE</h3>
        </div>

        <div class="card-body">
            <a class="btn btn-info" th:href="@{/st/excel}">Excel Export</a> |
            <a class="btn btn-info" th:href="@{/st/pdf}">PDF Export</a>
            <table class="table table-hover">
                <tr class="bg-success text-white">
                    <th>ID</th>
                    <th>MODE</th>
                    <th>CODE</th>
                    <th>ENABLE</th>
                    <th>GRADE</th>
                    <th>DESCRIPTION</th>
                    <th>OPERATION</th>
                </tr>
                <!-- for(ShipmentType ob:list) {} -->
                <tr th:each="ob:${list}">
                    <td th:text="${ob.id}"></td>
                    <td th:text="${ob.shipmentMode}"></td>
                    <td th:text="${ob.shipmentCode}"></td>
                    <td th:text="${ob.enableShipment}"></td>
                    <td th:text="${ob.shipmentGrade}"></td>
                    <td th:text="${ob.shipmentDescription}"></td>
                    <td>
                        <a class="btn btn-danger" th:href="@{/st/delete(id=${ob.id})}" title="remove"> DELETE </a>
                        |
                        <a class="btn btn-warning" th:href="@{/st/edit(id=${ob.id})}"> EDIT </a>
                        |
                        <a class="btn btn-info" th:href="@{/st/excelone(id=${ob.id})}"> EXCEL </a>
                    </td>
                </tr>
            </table>

        </div>

        <div class="card-footer alert alert-success" th:if="${message!=null}">
            <span th:text="${message}"></span>
        </div>

    </div>
</div>
<script type="text/javascript">
    $(document).ready(function () {
        $('a[title="remove"]').click(function () {
            return confirm("Do You want to Delete Shipment Type?");
        });
    });
</script>
</body>
</html>
