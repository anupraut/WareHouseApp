<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>

    <meta charset="ISO-8859-1">
    <title>Insert title here</title>
</head>
<body>

<div th:insert="fragments/commonui :: userheader"></div>
<div th:insert="fragments/commonui :: usermenu"></div>
<div class="container">

    <div class="card">

        <div class="card-header bg-primary text-white text-center">
            <h3>WELCOME TO SHIPMENT TYPE EDIT PAGE!</h3>
        </div>

        <div class="card-body">
            <form id="shipRegForm" method="POST" th:action="@{/st/update}" th:object="${shipmentType}">

                <div class="row">
                    <div class="col-3">
                        <label>Shipment ID</label>
                    </div>
                    <div class="col-4">
                        <input class="form-control" readOnly th:field="*{id}" type="text"/>
                    </div>

                </div>

                <div class="row">
                    <div class="col-3">
                        <label>Shipment Mode</label>
                    </div>
                    <div class="col-4">
                        <select class="form-control" th:field="*{shipmentMode}">
                            <option value="">-SELECT-</option>
                            <option value="Air">Air</option>
                            <option value="Truck">Truck</option>
                            <option value="Ship">Ship</option>
                            <option value="Train">Train</option>
                        </select>
                    </div>
                    <div class="col-5">
                        <span id="shipmentModeError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Shipment Code</label>
                    </div>
                    <div class="col-4">
                        <input class="form-control" th:field="*{shipmentCode}" type="text"/>
                    </div>
                    <div class="col-5">
                        <span id="shipmentCodeError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Enable Shipment</label>
                    </div>
                    <div class="col-4">
                        <input th:field="*{enableShipment}" type="radio" value="Yes"/> Yes <input
                            th:field="*{enableShipment}" type="radio" value="No"/> No
                    </div>
                    <div class="col-5">
                        <span id="enableShipmentError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Shipment Grade</label>
                    </div>
                    <div class="col-4">
                        <input th:field="*{shipmentGrade}" type="radio" value="A"/> A <input
                            th:field="*{shipmentGrade}" type="radio" value="B"/> B <input
                            th:field="*{shipmentGrade}" type="radio" value="C"/> C
                    </div>
                    <div class="col-5">
                        <span id="shipmentGradeError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Description</label>
                    </div>
                    <div class="col-4">
                        <textarea class="form-control" th:field="*{shipmentDescription}"></textarea>
                    </div>
                    <div class="col-5">
                        <span id="shipmentDescriptionError"></span>
                    </div>
                </div>

                <input class="btn btn-success" type="submit" value="Edit Shipment Type"/>
            </form>

        </div> <!-- Card Body end -->

    </div>
    <!-- card end -->

</div>
<!-- container end -->
<script th:src="@{/js/shipment.js}"></script>
</body>
</html>
