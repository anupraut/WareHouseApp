<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>Insert title here</title>
</head>
<body>

<div th:insert="fragments/commonui :: userheader"></div>
<div th:insert="fragments/commonui :: usermenu"></div>
<div class="container">

    <div class="card">

        <div class="card-header bg-primary text-white text-center">
            <h3>WELCOME TO SHIPMENT TYPE REGISTER PAGE!</h3>
        </div>

        <div class="card-body">
            <!-- Form id="" -->
            <form id="shipRegForm" method="POST" th:action="@{/st/save}">

                <div class="row">
                    <div class="col-3">
                        <label>Shipment Mode</label>
                    </div>
                    <div class="col-4">
                        <select class="form-control" id="shipmentMode" name="shipmentMode">
                            <option value="">-SELECT-</option>
                            <option value="Air">Air</option>
                            <option value="Truck">Truck</option>
                            <option value="Ship">Ship</option>
                            <option value="Train">Train</option>
                        </select>
                    </div>
                    <div class="col-5">
                        <span id="shipmentModeError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Shipment Code</label>
                    </div>
                    <div class="col-4">
                        <input class="form-control" id="shipmentCode" name="shipmentCode" type="text"/>
                    </div>
                    <div class="col-5">
                        <span id="shipmentCodeError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Enable Shipment</label>
                    </div>
                    <div class="col-4">
                        <input name="enableShipment" type="radio" value="Yes"/> Yes <input
                            name="enableShipment" type="radio" value="No"/> No
                    </div>
                    <div class="col-5">
                        <span id="enableShipmentError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Shipment Grade</label>
                    </div>
                    <div class="col-4">
                        <input name="shipmentGrade" type="radio" value="A"/> A <input
                            name="shipmentGrade" type="radio" value="B"/> B <input
                            name="shipmentGrade" type="radio" value="C"/> C
                    </div>
                    <div class="col-5">
                        <span id="shipmentGradeError"></span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-3">
                        <label>Description</label>
                    </div>
                    <div class="col-4">
                        <textarea class="form-control" id="shipmentDescription" name="shipmentDescription"></textarea>
                    </div>
                    <div class="col-5">
                        <span id="shipmentDescriptionError"></span>
                    </div>
                </div>

                <input class="btn btn-success" type="submit" value="Add Shipment Type"/>
            </form>

        </div> <!-- Card Body end -->

        <div class="card-footer alert alert-success" th:if="${message!=null}">
            <span th:text="${message}"></span>
        </div>

    </div>
    <!-- card end -->

</div>
<!-- container end -->
<script th:src="@{/js/shipment.js}"></script>
</body>
</html>
