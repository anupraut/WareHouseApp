<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="ISO-8859-1">
    <title>Insert title here</title>
</head>

<body>

<div th:insert="fragments/commonui :: userheader"></div>
<div th:insert="fragments/commonui :: usermenu"></div>
<div class="container">

    <div class="card">
        <div class="card-header bg-primary text-white text-center">
            <h3>UOM REGISTE PAGE</h3>
        </div>


        <div class="card-body">
            <form id="uomRegForm" method="POST" th:action="@{/uom/save}" th:object="${uom}">

                <div class="row">
                    <div class="col-2">
                        <label>UOM TYPE</label>
                    </div>
                    <div class="col-5">
                        <select class="form-control" th:field="*{uomType}">
                            <option value="">-SELECT-</option>
                            <option value="PACKING">PACKING</option>
                            <option value="NO PACKING">NO PACKING</option>
                            <option value="NA">NA</option>
                        </select>
                    </div>
                    <div class="col-5">
                        <span id="uomTypeError"></span>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2">
                        <label>UOM MODEL</label>
                    </div>
                    <div class="col-5">
                        <input class="form-control" th:field="*{uomModel}" type="text"/>
                    </div>
                    <div class="col-5">
                        <span id="uomModelError"></span>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2">
                        <label>DESCRIPTION</label>
                    </div>
                    <div class="col-5">
                        <textarea class="form-control" th:field="*{description}"></textarea>
                    </div>
                    <div class="col-5">
                        <span id="descriptionError"></span>
                    </div>
                </div>
                <input class="btn btn-success" type="submit" value="ADD UOM"/>
            </form>
        </div>
        <!--card body end-->

        <div class="card-footer bg-info text-white text-center" th:if="${message != null}">
            <span th:text="${message}"></span>
        </div>

    </div>
    <!--card end-->

</div>
<!--container end-->
<script th:src="@{/js/uoms.js}" type="text/javascript"></script>
</body>

</html>
