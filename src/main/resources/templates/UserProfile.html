<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>Insert title here</title>
</head>
<body>

<div th:insert="fragments/commonui :: userheader"></div>
<div th:insert="fragments/commonui :: usermenu"></div>
<div class="container">

    <div class="card">

        <div class="card-header bg-primary text-white text-center">
            <h3>USER PROFILE PAGE</h3>
        </div>

        <div class="card-body">
            <table class="table table-hover">
                <tr>
                    <th>ID</th>
                    <td class="bg-info text-white" th:text="${usr.id}"></td>
                </tr>
                <tr>
                    <th>NAME</th>
                    <td class="bg-info text-white" th:text="${usr.uname}"></td>
                </tr>
                <tr>
                    <th>EMAIL</th>
                    <td class="bg-info text-white" th:text="${usr.email}"></td>
                </tr>
                <tr>
                    <th>PASSWORD</th>
                    <td>
                        <a class="btn btn-danger" th:href="@{/user/showPwdUpdate}">Update Password</a>
                    </td>
                </tr>
                <tr>
                    <th>ROLES</th>
                    <td class="bg-info text-white" th:text="${usr.roles}"></td>
                </tr>
            </table>
        </div>
        <!--card body end-->
    </div>
    <!-- card end -->
</div>
<!-- container end -->
</body>
</html>
