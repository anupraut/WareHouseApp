<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="ISO-8859-1">
    <title>Insert title here</title>
</head>

<body>
<div th:insert="fragments/commonui :: userheader"></div>
<div th:insert="fragments/commonui :: usermenu"></div>
<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white text-center">
            <h3>USER REGISTE PAGE</h3>
        </div>


        <div class="card-body">
            <form method="POST" th:action="@{/user/save}">

                <div class="row">
                    <div class="col-2">
                        <label>NAME</label>
                    </div>
                    <div class="col-5">
                        <input class="form-control" name="uname" type="text"/>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2">
                        <label>EMAIL</label>
                    </div>
                    <div class="col-5">
                        <input class="form-control" name="email" type="text"/>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2">
                        <label>PASSWORD</label>
                    </div>
                    <div class="col-5">
                        <input class="form-control" name="pwd" placeholder="Auto-Generated" readonly type="password"/>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2">
                        <label>ROLES</label>
                    </div>
                    <div class="col-5">
                        <input name="roles" type="checkbox" value="ADMIN"/> ADMIN
                        <input name="roles" type="checkbox" value="APPUSER"/> APPUSER
                    </div>
                </div>


                <input class="btn btn-success" type="submit" value="CREATE USER"/>
            </form>
        </div>
        <!--card body end-->

        <div class="card-footer bg-info text-white text-center" th:if="${message != null}">
            <span th:text="${message}"></span>
        </div>

    </div>
    <!--card end-->

</div>
</body>

</html>
